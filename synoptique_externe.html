<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synoptique des Moyens - PTR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #333;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
        }

        .centre-badge {
            background: #dcfce7;
            color: #166534;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 13px;
        }

        .timestamp {
            color: #666;
            font-size: 12px;
        }

        .synoptique-container {
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .centre-group {
            margin-bottom: 0;
            border-bottom: 1px solid #ddd;
        }

        .centre-group:last-child {
            border-bottom: none;
        }

        .centre-header {
            background: #ccc;
            color: #333;
            font-weight: 800;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .centre-header.active {
            background: #dcfce7;
            color: #166534;
        }

        .section-row {
            display: flex;
            background: white;
            border-bottom: 1px solid #eee;
            min-height: 50px;
        }

        .section-row:last-child {
            border-bottom: none;
        }

        .section-label {
            width: 110px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            text-align: center;
            border-right: 2px solid #ddd;
            flex-shrink: 0;
        }

        .section-label.red {
            background: #fee2e2;
            color: #991b1b;
        }

        .section-label.green {
            background: #dcfce7;
            color: #166534;
        }

        .section-name {
            margin-bottom: 2px;
            font-size: 11px;
        }

        .section-stats {
            font-size: 9px;
            opacity: 0.8;
        }

        .section-engins {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            align-items: center;
        }

        .engin-box {
            background: #ffedd5;
            border: 1px solid #fb923c;
            border-radius: 4px;
            padding: 6px 12px;
            font-weight: 800;
            font-size: 12px;
            color: #333;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .engin-box.indisponible {
            background: #333;
            color: white;
            border-color: #000;
        }

        .engin-box.intervention {
            background: #ef4444;
            color: white;
            border-color: #b91c1c;
        }

        /* BER Statuts */
        .engin-box.ber-nouveau {
            background: #3b82f6;
            color: white;
            border-color: #1e40af;
        }

        .engin-box.ber-en-route {
            background: #f97316;
            color: white;
            border-color: #c2410c;
        }

        .engin-box.ber-intervenant {
            background: #ef4444;
            color: white;
            border-color: #b91c1c;
        }

        .engin-box.ber-retour {
            background: #8b5cf6;
            color: white;
            border-color: #6d28d9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            .section-label {
                width: 80px;
                font-size: 9px;
            }

            .engin-box {
                font-size: 10px;
                padding: 4px 8px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 SYNOPTIQUE DES MOYENS</h1>
            </div>
            <div class="header-right">
                <div class="centre-badge" id="centre-name">PTR</div>
                <div class="timestamp" id="timestamp">--:--</div>
            </div>
        </div>

        <div id="error-container"></div>

        <div class="synoptique-container" id="synoptique-container">
            <div class="loading">Chargement des données...</div>
        </div>
    </div>

    <script>
        // Configuration
        const SYSTEL_URL = 'https://systel-bmpm-v3.vercel.app';
        const UPDATE_INTERVAL = 5000; // 5 secondes

        // Données locales
        let CASERNES = [];
        let ENGINS = [];
        let BER_STATUTS = [
            { code: 'nouveau', label: 'NOUVEAU', couleur: '#3b82f6' },
            { code: 'en-route', label: 'EN ROUTE', couleur: '#f97316' },
            { code: 'intervenant', label: 'INTERVENANT', couleur: '#ef4444' },
            { code: 'retour', label: 'RETOUR', couleur: '#8b5cf6' },
            { code: 'fin', label: 'FIN', couleur: '#ffedd5' }
        ];

        // Charger les données depuis Systel
        async function loadData() {
            try {
                // Créer une iframe cachée pour accéder aux données de Systel
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = SYSTEL_URL;
                
                iframe.onload = () => {
                    try {
                        // Accéder aux variables globales de Systel via l'iframe
                        const iframeWindow = iframe.contentWindow;
                        
                        if (iframeWindow.CASERNES && iframeWindow.ENGINS) {
                            CASERNES = JSON.parse(JSON.stringify(iframeWindow.CASERNES));
                            ENGINS = JSON.parse(JSON.stringify(iframeWindow.ENGINS));
                            
                            if (iframeWindow.BER_STATUTS) {
                                BER_STATUTS = iframeWindow.BER_STATUTS;
                            }
                            
                            render();
                        }
                    } catch (e) {
                        console.warn('Erreur accès iframe:', e);
                        // Essayer avec localStorage
                        loadFromLocalStorage();
                    }
                };
                
                document.body.appendChild(iframe);
                
                // Timeout pour éviter les blocages
                setTimeout(() => {
                    if (document.getElementById('synoptique-container').innerHTML.includes('Chargement')) {
                        loadFromLocalStorage();
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Erreur lors du chargement:', error);
                loadFromLocalStorage();
            }
        }

        // Fallback: charger depuis localStorage
        function loadFromLocalStorage() {
            try {
                const casernesData = localStorage.getItem('systel_casernes');
                const enginsData = localStorage.getItem('systel_engins');
                
                if (casernesData) CASERNES = JSON.parse(casernesData);
                if (enginsData) ENGINS = JSON.parse(enginsData);
                
                render();
            } catch (e) {
                console.warn('Erreur localStorage:', e);
                showError('Impossible de charger les données');
            }
        }

        function render() {
            const container = document.getElementById('synoptique-container');
            
            if (!CASERNES.length) {
                container.innerHTML = '<div class="loading">Aucune caserne disponible</div>';
                return;
            }

            container.innerHTML = CASERNES.map(centre => {
                const allSectionsIds = centre.sections.map(s => s.id);
                const enginsDuCentre = ENGINS.filter(e => allSectionsIds.includes(e.section));
                const isCentreActive = enginsDuCentre.length > 0;

                return `
                    <div class="centre-group">
                        <div class="centre-header ${isCentreActive ? 'active' : ''}">
                            ${centre.nom} ${isCentreActive ? '●' : '○'}
                        </div>
                        ${centre.sections.map(section => {
                            const enginsSection = ENGINS.filter(e => e.section === section.id);
                            const hasEngins = enginsSection.length > 0;
                            
                            return `
                                <div class="section-row">
                                    <div class="section-label ${hasEngins ? 'green' : 'red'}">
                                        <div class="section-name">${section.nom}</div>
                                        <div class="section-stats">${enginsSection.length}</div>
                                    </div>
                                    <div class="section-engins">
                                        ${enginsSection.map(e => renderEngin(e)).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');

            updateTimestamp();
        }

        function renderEngin(engin) {
            const ber = engin.berStatut ? BER_STATUTS.find(b => b.code === engin.berStatut) : null;
            let className = 'engin-box';
            let style = '';

            if (ber) {
                className += ` ber-${engin.berStatut}`;
                style = `background: ${ber.couleur}; color: white; border-color: ${ber.couleur};`;
            } else if (engin.statut === 'indisponible') {
                className += ' indisponible';
            } else if (engin.statut === 'intervention') {
                className += ' intervention';
            }

            return `<div class="${className}" style="${style}" title="${ber ? ber.label : engin.statut}">${engin.nom}</div>`;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        // Initialiser
        loadData();
        setInterval(loadData, UPDATE_INTERVAL);

        // Écouter les changements dans le localStorage
        window.addEventListener('storage', (e) => {
            if (e.key === 'systel_casernes' || e.key === 'systel_engins') {
                loadData();
            }
        });
    </script>
</body>
</html>
